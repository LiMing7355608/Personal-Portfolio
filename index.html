<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="前端网页作品集：Recipe Finder、Quiz Game、Register Web。">
    <title>前端网页作品集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <span class="header-dot" aria-hidden="true"></span>
            <h1><span class="title-accent">Liming7355608</span>的前端网页作品集</h1>
            <p>三个独立完成的前端页面练习，点击卡片在新标签页打开。</p>
        </header>

        <p class="meta-line">
            <span class="meta-index">03</span>
            件作品
            <span aria-hidden="true">·</span>
            纯 HTML / CSS / JavaScript
        </p>

        <div class="projects-grid" id="projects">

            <article class="project" data-url="https://recipe-psi-plum.vercel.app/">
                <div class="project-thumb">
                    <img src="./image/recipe.png" alt="Recipe Finder 项目预览" loading="lazy">
                    <span class="project-num">01</span>
                    <span class="project-glow" aria-hidden="true"></span>
                </div>
                <div class="project-info">
                    <h3 class="project-title">Recipe Finder</h3>
                    <div class="project-tag">食谱搜索 · API 数据</div>
                    <span class="project-cta">查看作品 <span aria-hidden="true">↗</span></span>
                </div>
            </article>

            <article class="project" data-url="https://quiz-game-three-ebon.vercel.app/">
                <div class="project-thumb">
                    <img src="./image/quizgame.png" alt="Quiz Game 项目预览" loading="lazy">
                    <span class="project-num">02</span>
                    <span class="project-glow" aria-hidden="true"></span>
                </div>
                <div class="project-info">
                    <h3 class="project-title">Quiz Game</h3>
                    <div class="project-tag">答题游戏 · 状态管理</div>
                    <span class="project-cta">查看作品 <span aria-hidden="true">↗</span></span>
                </div>
            </article>

            <article class="project" data-url="https://register-web-zeta.vercel.app/">
                <div class="project-thumb">
                    <img src="./image/register-web.png" alt="Register Web 项目预览" loading="lazy">
                    <span class="project-num">03</span>
                    <span class="project-glow" aria-hidden="true"></span>
                </div>
                <div class="project-info">
                    <h3 class="project-title">Register Web</h3>
                    <div class="project-tag">注册表单 · 交互校验</div>
                    <span class="project-cta">查看作品 <span aria-hidden="true">↗</span></span>
                </div>
            </article>

        </div>

        <footer>
            <span>2026</span>
            <span aria-hidden="true">·</span>
            <span>Made with HTML &amp; CSS</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
